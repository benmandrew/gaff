[package]
name = "gaff"
version = "0.1.0"
edition = "2021"
description = "TUI listing live Claude Code agents, their directories, and what they're working on"

[dependencies]
anyhow = "1"
crossterm = "0.28"
libc = "0.2"
notify = "7"
ratatui = "0.29"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[dev-dependencies]
tempfile = "3"

[profile.release]
# Size matters more than speed here: the work is a few file reads per second.
# 1,054,048 -> 608,624 bytes. Rebuilding std on nightly reaches 493,152, which
# is not worth a nightly toolchain and an explicit target for 115 KiB.
opt-level = "z"
lto = "fat"
codegen-units = 1
panic = "abort"
strip = true
